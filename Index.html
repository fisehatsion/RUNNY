<!DOCTYPE html
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNNY - Bot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 12px; }
        .modal-content { background-color: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; }
        .form-control, .form-select { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; color: #fff; border-color: #3b82f6; box-shadow: none; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .status-running { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-stopped { background-color: #ef4444; }
        pre { background-color: #090d16; color: #38bdf8; padding: 12px; border-radius: 8px; max-height: 200px; overflow-y: auto; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <h1 class="fw-bold text-primary mb-0">⚡ RUNNY</h1>
        <button class="btn btn-primary fw-semibold px-4" data-bs-toggle="modal" data-bs-target="#newSpaceModal">
            + New space
        </button>
    </div>

    <div class="row" id="spacesList"></div>
</div>

<!-- Modal: New Space -->
<div class="modal fade" id="newSpaceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header border-secondary">
                <h5 class="modal-title fw-bold">Create New Space</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createSpaceForm">
                    <div class="mb-3">
                        <label class="form-label">Space Name</label>
                        <input type="text" id="spaceName" class="form-control" placeholder="e.g. My Telegram Bot" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Programming Language</label>
                            <select id="spaceLang" class="form-select" onchange="updateDefaultFilename()">
                                <option value="python">Python</option>
                                <option value="nodejs">Node.js</option>
                                <option value="go">Golang</option>
                                <option value="bash">Bash</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Main Entry File</label>
                            <input type="text" id="spaceFilename" class="form-control" value="bot.py" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Environment Variables (e.g. BOT_TOKEN=xyz)</label>
                        <textarea id="spaceEnv" class="form-control" rows="2" placeholder="BOT_TOKEN=123456789:ABCDEF..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bot Code</label>
                        <textarea id="spaceCode" class="form-control font-monospace" rows="8" placeholder="Paste your bot code here..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-semibold">Deploy Space</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
let spaces = JSON.parse(localStorage.getItem('runny_spaces') || '{}');

function updateDefaultFilename() {
    const lang = document.getElementById('spaceLang').value;
    const filenameInput = document.getElementById('spaceFilename');
    if (lang === 'python') filenameInput.value = 'bot.py';
    else if (lang === 'nodejs') filenameInput.value = 'index.js';
    else if (lang === 'go') filenameInput.value = 'main.go';
    else if (lang === 'bash') filenameInput.value = 'script.sh';
}

function saveSpaces() {
    localStorage.setItem('runny_spaces', JSON.stringify(spaces));
    renderSpaces();
}

function renderSpaces() {
    const container = document.getElementById('spacesList');
    container.innerHTML = '';

    const spaceKeys = Object.keys(spaces);
    if (spaceKeys.length === 0) {
        container.innerHTML = `<div class="text-center text-muted py-5">No active spaces. Click <strong>+ New space</strong> to start running bots.</div>`;
        return;
    }

    spaceKeys.forEach(id => {
        const space = spaces[id];
        const isRunning = space.running;
        const cardHtml = `
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title mb-0">${space.name}</h5>
                            <span class="badge bg-secondary text-uppercase">${space.language}</span>
                        </div>
                        <p class="small text-muted mb-3">
                            Status: <span class="status-dot ${isRunning ? 'status-running' : 'status-stopped'}"></span> 
                            ${isRunning ? 'Running' : 'Stopped'}
                        </p>
                        <div class="d-flex gap-2 mb-3">
                            ${isRunning ? 
                                `<button class="btn btn-danger btn-sm" onclick="toggleSpace('${id}', false)">Stop</button>` :
                                `<button class="btn btn-success btn-sm" onclick="toggleSpace('${id}', true)">Start</button>`
                            }
                            <button class="btn btn-outline-info btn-sm" onclick="toggleLogs('${id}')">Logs</button>
                            <button class="btn btn-outline-danger btn-sm ms-auto" onclick="deleteSpace('${id}')">Delete</button>
                        </div>
                        <pre id="logs-${id}" class="d-none font-monospace mb-0">${space.logs || 'No logs recorded.'}</pre>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML += cardHtml;
    });
}

document.getElementById('createSpaceForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const id = 'space_' + Date.now();
    spaces[id] = {
        id: id,
        name: document.getElementById('spaceName').value,
        language: document.getElementById('spaceLang').value,
        filename: document.getElementById('spaceFilename').value,
        env: document.getElementById('spaceEnv').value,
        code: document.getElementById('spaceCode').value,
        running: false,
        logs: `[${new Date().toLocaleTimeString()}] Space deployed successfully.\n`
    };
    saveSpaces();
    bootstrap.Modal.getInstance(document.getElementById('newSpaceModal')).hide();
    document.getElementById('createSpaceForm').reset();
});

function toggleSpace(id, status) {
    if (spaces[id]) {
        spaces[id].running = status;
        const time = new Date().toLocaleTimeString();
        spaces[id].logs += status ? `[${time}] Space started.\n` : `[${time}] Space stopped.\n`;
        saveSpaces();
    }
}

function toggleLogs(id) {
    const el = document.getElementById(`logs-${id}`);
    if (el) el.classList.toggle('d-none');
}

function deleteSpace(id) {
    if (spaces[id]) {
        delete spaces[id];
        saveSpaces();
    }
}

renderSpaces();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
